name: Setup pnpm workspace
description: Install Node, pnpm, and frozen workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "20"
  registry-url:
    description: Optional npm registry URL (e.g. for publishing with provenance).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Setup Socket Firewall
      uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free

    - name: Install dependencies
      shell: bash
      run: sfw pnpm install --ignore-scripts --frozen-lockfile
