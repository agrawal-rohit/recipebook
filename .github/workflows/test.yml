name: Test (Coverage)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run tests with coverage
        run: pnpm cov

  mutation:
    name: Mutation (Incremental)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Restore Stryker incremental cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.ref }}
            stryker-incremental-refs/heads/main

      - name: Run mutation gate on changed lines
        run: pnpm mutate:changed

  mutation-full:
    name: Mutation (Comprehensive)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Restore Stryker incremental cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref }}-${{ github.sha }}

      - name: Run full mutation baseline
        run: pnpm mutate

      - name: Save Stryker incremental cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref }}-${{ github.sha }}
